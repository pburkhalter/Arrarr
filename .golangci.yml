version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (*github.com/pburkhalter/arrarr/internal/store.Store).Close
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
